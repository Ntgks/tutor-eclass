spring.application.name=eclass

spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5434/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}

app.storage.directory=${STORAGE_DIRECTORY:./storage}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=52MB

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_FROM:no-reply@tutor-eclass.test}

app.storage.provider=${STORAGE_PROVIDER:local}

app.supabase.url=${SUPABASE_URL:}
app.supabase.secret-key=${SUPABASE_SECRET_KEY:}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:eclass-files}